<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame - Mohammad Baig</title>
    <link rel="stylesheet" href="css/songs.css">
</head>
<body>

    <!-- Massive Background Watermark -->
    <div class="bg-watermark">SONGS</div>

    <!-- Falling/Floating Home Button -->
    <a href="index.html" class="nav-back" title="Back to Home" style="width: 45px; height: 45px; display: block;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>

    <!-- The Dancing Apple Glass Search Bar -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search divine music...">
    </div>

    <!-- The 3D Rotating Hall of Fame -->
    <div class="carousel-container" id="scrollContainer">
        <div class="carousel" id="albumCarousel">
        </div>
    </div>

    <!-- NEW: The Scroll Progress Bar -->
    <div class="scroll-track">
        <div class="scroll-fill" id="scrollFill"></div>
    </div>

    <!-- NEW: The Click-to-Focus Modal -->
    <div class="focus-modal" id="focusModal" onclick="closeFocus()">
        <img src="" id="focusImage" alt="Focused Image">
        <p class="focus-hint">Click anywhere to return</p>
    </div>

    <script src="js/songs.js"></script>
</body>
</html>
